<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Museum of the Abandoned — Space Library</title>
  <link rel="stylesheet" href="./space.css?v=mobile-book-controls-20261112">
  <link rel="stylesheet" href="../Audio/background-music.css">
</head>
<body>
  <audio id="backgroundMusic" class="background-music-audio" src="../Audio/Piano.mp3" loop preload="auto"></audio>
  <main class="museum-library">
    <section id="library-entry" class="library-entry" aria-labelledby="library-title">
      <img class="library-scene-image" src="./space_images/bg.png" alt="" aria-hidden="true">
      <header class="library-heading">
        <p>WELCOME, EXPLORER</p>
        <h1 id="library-title">The Space Library</h1>
        <span>Choose a book to begin your next discovery.</span>
      </header>
      <div class="library-books" aria-label="Choose a mission collection">
        <button type="button" class="library-book library-book--moon" data-library-destination="MOON" aria-label="Open Moon Missions">
          <span class="library-book-title">Moon Missions</span>
          <span class="library-book-action">Explore</span>
        </button>
        <button type="button" class="library-book library-book--mars" data-library-destination="MARS" aria-label="Open Mars Missions">
          <span class="library-book-title">Mars Missions</span>
          <span class="library-book-action">Explore</span>
        </button>
        <button type="button" class="library-book library-book--space" data-library-destination="SPACE" aria-label="Open Deep Space Missions">
          <span class="library-book-title">Deep Space Missions</span>
          <span class="library-book-action">Explore</span>
        </button>
      </div>
    </section>
  </main>
  <dialog id="guide-welcome" class="guide-welcome" aria-labelledby="guide-welcome-title">
    <img class="guide-welcome-image" src="./space_images/Guide.png" alt="Mr. Stone, your museum guide">
    <section class="guide-welcome-card">
      <div class="guide-welcome-content">
        <p class="guide-welcome-kicker">A WELCOME FROM YOUR GUIDE</p>
        <h2 id="guide-welcome-title">Welcome to the Museum</h2>
        <p id="guide-welcome-message"></p>
        <form method="dialog">
          <button class="guide-welcome-dismiss">Choose a book</button>
        </form>
      </div>
    </section>
  </dialog>
  <dialog id="book-dialog" class="book-dialog" aria-labelledby="book-dialog-title">
    <form method="dialog">
      <button class="dialog-close" aria-label="Close">&times;</button>
    </form>
    <p class="dialog-kicker">MISSION COLLECTION</p>
    <h2 id="book-dialog-title"></h2>
    <p id="book-dialog-description"></p>
  </dialog>
  <script src="../Audio/background-music.js"></script>
  <script src="./space.js?v=deepspace-destination-20261112"></script>
</body>
</html>
